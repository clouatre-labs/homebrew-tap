name: Audit

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          annotations: true
          min-severity: high

  Audit:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@f78b97900ce6c3c9c4e99de00a999e5541eeaabb # master
      - name: Tap this repository
        run: |
          mkdir -p $(brew --repository)/Library/Taps/clouatre-labs
          ln -s $GITHUB_WORKSPACE $(brew --repository)/Library/Taps/clouatre-labs/homebrew-tap
      - name: Audit formulae
        run: brew audit --strict --online --tap clouatre-labs/tap
