name: Audit

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
        with:
          advanced-security: false
          annotations: true
          min-severity: high

  Audit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: Homebrew/actions/setup-homebrew@2ebcf16054461267868620b1414507f3ccc765c1 # master
      - name: Tap this repository
        run: |
          mkdir -p $(brew --repository)/Library/Taps/clouatre-labs
          ln -s $GITHUB_WORKSPACE $(brew --repository)/Library/Taps/clouatre-labs/homebrew-tap
      - name: Audit formulae
        run: brew audit --strict --online --tap clouatre-labs/tap
